name: docai
description: "An app to heal the world"

version: 6.1.48+93

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^4.1.0
  firebase_crashlytics: ^5.0.1
  firebase_analytics: ^12.0.1

  intl: ^0.20.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  uuid: ^4.5.1
  timeago: ^3.7.0
  speech_to_text: ^7.3.0
  in_app_update: ^4.2.5
  package_info_plus: ^8.2.0
  cloud_firestore: ^6.1.0

dev_dependencies:
  flutter_launcher_icons: "^0.14.4"
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo/xmas.webp
    - assets/logo/logo compress.webp

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/xmas.png"
  min_sdk_android: 16
  web:
    generate: true
    image_path: "assets/logo/xmas.png"
    background_color: "#FFF"
    theme_color: "#000"
  windows:
    generate: true
    image_path: "assets/logo/xmas.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo/xmas.png"

# MSIX Configuration for Microsoft Store
msix_config:
  display_name: "DocAI"
  publisher_display_name: "Oriol Giner"
  identity_name: "OriolGiner.Docai"
  publisher: "CN=2A1BF35C-B236-4EA2-9703-E3FBAD46CF55"
  msix_version: 6.1.48.0
  store: true
  architecture: x64
  logo_path: assets/logo/xmas.png
