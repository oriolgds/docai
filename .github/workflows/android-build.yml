name: Build Android APK and AAB

on:
  push:
    branches: [ main ]  # Solo main para reducir ejecuciones
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read
  actions: write

# Cancela workflows anteriores
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.4'
  GRADLE_OPTS: '-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.caching=true'
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [apk, aab]
    
    steps:
      - name: Cancel Previous Workflow Runs
        uses: styfle/cancel-workflow-action@0.12.0
        with:
          access_token: ${{ github.token }}

      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Flutter con cache integrado
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Cache consolidado para Flutter y Dart
      - name: Cache Flutter & Dart Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
            ${{ github.workspace }}/.packages
            ${{ github.workspace }}/.flutter-plugins
            ${{ github.workspace }}/.flutter-plugin-dependencies
          key: flutter-dart-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-dart-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            flutter-dart-${{ runner.os }}-

      # Cache consolidado para Android y Gradle
      - name: Cache Android & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/build
            android/app/build
          key: android-gradle-${{ runner.os }}-${{ matrix.build-type }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-${{ matrix.build-type }}-
            android-gradle-${{ runner.os }}-

      # Crear firebase_options.dart desde secret
      - name: Create firebase_options.dart from secret
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          mkdir -p lib
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            cat > lib/firebase_options.dart << 'EOF'
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF
            echo "✓ Firebase options file created successfully"
          else
            echo "❌ FIREBASE_OPTIONS_DART secret not found"
            exit 1
          fi

      # Crear .env desde secret
      - name: Create .env file from secret
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          if [ -n "$DOT_ENV" ]; then
            cat > .env << 'EOF'
          ${{ secrets.DOT_ENV }}
          EOF
            echo "✓ .env file created successfully"
          else
            echo "❌ DOT_ENV secret not found"
            exit 1
          fi

      # Decodificar keystore desde secret
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "✓ Keystore decoded successfully"
          else
            echo "❌ KEYSTORE_BASE64 secret not found"
            exit 1
          fi

      # Crear key.properties
      - name: Create key.properties
        run: |
          mkdir -p android
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          echo "✓ key.properties created successfully"

      # Verificación simplificada de archivos críticos
      - name: Verify critical files
        run: |
          test -f lib/firebase_options.dart && echo "✓ firebase_options.dart exists"
          test -f android/app/upload-keystore.jks && echo "✓ keystore exists"
          grep -q "DefaultFirebaseOptions" lib/firebase_options.dart && echo "✓ firebase_options.dart valid"

      # Obtener dependencias (sin análisis innecesario)
      - name: Get dependencies
        run: |
          echo "📦 Installing Flutter dependencies..."
          flutter pub get
          # Solo ejecutar análisis en PRs
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            flutter analyze --no-fatal-infos || true
          fi

      # Configurar Gradle con memoria optimizada
      - name: Configure Gradle properties
        run: |
          mkdir -p ~/.gradle android/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.configureondemand=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableR8.fullMode=true
          kotlin.compiler.execution.strategy=in-process
          EOF
          
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableR8.fullMode=true
          kotlin.code.style=official
          EOF
          echo "✓ Gradle configuration optimized"

      # Build APK optimizado
      - name: Build APK
        if: matrix.build-type == 'apk'
        run: |
          echo "🔨 Building APK..."
          export GRADLE_OPTS="$GRADLE_OPTS -Dorg.gradle.build-cache=true"
          
          # APK universal para PRs, split-per-abi para main
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            flutter build apk --release \
              --tree-shake-icons \
              --shrink
            echo "✓ Universal APK built for PR"
          else
            flutter build apk --release \
              --split-per-abi \
              --tree-shake-icons \
              --shrink
            echo "✓ Split APKs built"
          fi
          
          ls -lh build/app/outputs/flutter-apk/

      # Build AAB optimizado
      - name: Build AAB
        if: matrix.build-type == 'aab'
        run: |
          echo "🔨 Building AAB..."
          export GRADLE_OPTS="$GRADLE_OPTS -Dorg.gradle.build-cache=true"
          
          flutter build appbundle --release \
            --tree-shake-icons \
            --shrink
          
          echo "✓ AAB build completed"
          ls -lh build/app/outputs/bundle/release/

      # Subir artifacts APK con retención reducida para PRs
      - name: Upload APK artifacts
        if: matrix.build-type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: docai-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          compression-level: 1

      # Subir artifacts AAB con retención reducida para PRs
      - name: Upload AAB artifacts
        if: matrix.build-type == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: docai-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          compression-level: 1

      # Limpiar archivos sensibles
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f lib/firebase_options.dart
          rm -f .env
          echo "✓ Sensitive files cleaned up"
