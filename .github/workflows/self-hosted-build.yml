name: Self-Hosted Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  actions: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.caching=true'

jobs:
  build:
    name: Build All (Self-Hosted)
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Secrets Setup (Using bash for compatibility)
      - name: Create firebase_options.dart from secret
        shell: bash
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          mkdir -p lib
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            cat > lib/firebase_options.dart << 'EOF'
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF
            echo "✓ Firebase options file created successfully"
          else
            echo "❌ FIREBASE_OPTIONS_DART secret not found"
            exit 1
          fi

      - name: Create .env file from secret
        shell: bash
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          if [ -n "$DOT_ENV" ]; then
            cat > .env << 'EOF'
          ${{ secrets.DOT_ENV }}
          EOF
            echo "✓ .env file created successfully"
          else
            echo "❌ DOT_ENV secret not found"
            exit 1
          fi

      - name: Decode keystore from secret
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "✓ Keystore decoded successfully"
          else
            echo "❌ KEYSTORE_BASE64 secret not found"
            exit 1
          fi

      - name: Create key.properties
        shell: bash
        run: |
          mkdir -p android
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          echo "✓ key.properties created successfully"

      # Flutter Setup
      - name: Get dependencies
        run: flutter pub get

      - name: Get version from pubspec.yaml
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Android Build
      - name: Build AAB
        run: flutter build appbundle --release --tree-shake-icons --shrink

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: docai-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build APK (Release)
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release --split-per-abi --tree-shake-icons --shrink

      - name: Build APK (PR/Other)
        if: github.ref != 'refs/heads/main'
        run: flutter build apk --release --tree-shake-icons --shrink

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: docai-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30


      # Release
      - name: Publish to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cleanup
      - name: Cleanup sensitive files
        if: always()
        shell: bash
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f lib/firebase_options.dart
          rm -f .env
          echo "✓ Sensitive files cleaned up"
