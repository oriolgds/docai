name: Self-Hosted Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  actions: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.caching=true'

jobs:
  build:
    name: Build All (Self-Hosted)
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Secrets Setup (Using PowerShell)
      - name: Create firebase_options.dart from secret
        shell: powershell
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          New-Item -ItemType Directory -Force -Path "lib" | Out-Null
          if ($env:FIREBASE_OPTIONS_DART) {
            $env:FIREBASE_OPTIONS_DART | Set-Content -Path "lib/firebase_options.dart" -Encoding UTF8
            Write-Host "[OK] Firebase options file created successfully"
          } else {
            Write-Error "[ERROR] FIREBASE_OPTIONS_DART secret not found"
            exit 1
          }

      - name: Create .env file from secret
        shell: powershell
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          if ($env:DOT_ENV) {
            $env:DOT_ENV | Set-Content -Path ".env" -Encoding UTF8
            Write-Host "[OK] .env file created successfully"
          } else {
            Write-Error "[ERROR] DOT_ENV secret not found"
            exit 1
          }

      - name: Decode keystore from secret
        shell: powershell
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force -Path "android/app" | Out-Null
          if ($env:KEYSTORE_BASE64) {
             $bytes = [System.Convert]::FromBase64String($env:KEYSTORE_BASE64)
             [System.IO.File]::WriteAllBytes("android/app/upload-keystore.jks", $bytes)
             Write-Host "[OK] Keystore decoded successfully"
          } else {
             Write-Error "[ERROR] KEYSTORE_BASE64 secret not found"
             exit 1
          }

      - name: Create key.properties
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "android" | Out-Null
          $content = @"
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          "@
          $content | Set-Content -Path "android/key.properties" -Encoding UTF8
          Write-Host "[OK] key.properties created successfully"

      # Flutter Setup
      - name: Get dependencies
        run: flutter pub get

      - name: Get version from pubspec.yaml
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $version = (Select-String -Path "pubspec.yaml" -Pattern "^version: ").Line -replace "version: ", ""
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Android Build
      - name: Build AAB
        run: flutter build appbundle --release --tree-shake-icons --shrink

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: docai-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          compression-level: 1

      # Publish to Release (AAB)
      - name: Publish AAB to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build APK (Release)
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release --split-per-abi --tree-shake-icons --shrink

      - name: Build APK (PR/Other)
        if: github.ref != 'refs/heads/main'
        run: flutter build apk --release --tree-shake-icons --shrink

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: docai-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          compression-level: 1

      # Publish to Release (APK)
      - name: Publish APK to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cleanup
      - name: Cleanup sensitive files
        if: always()
        shell: powershell
        run: |
          Remove-Item -Path "android/app/upload-keystore.jks" -ErrorAction SilentlyContinue
          Remove-Item -Path "android/key.properties" -ErrorAction SilentlyContinue
          Remove-Item -Path "lib/firebase_options.dart" -ErrorAction SilentlyContinue
          Remove-Item -Path ".env" -ErrorAction SilentlyContinue
          Write-Host "[OK] Sensitive files cleaned up"
